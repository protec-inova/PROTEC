spring:
  application:
    name: protec

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema vem do schema.sql; o Hibernate só confere

  sql:
    init:
      mode: always # roda schema.sql (CREATE ... IF NOT EXISTS) ao subir

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
